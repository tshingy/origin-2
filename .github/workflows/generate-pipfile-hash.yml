name: Regenerate Pipfile.lock for Dependabot PRs

on:
  pull_request:
    paths:
      - "Pipfile"

permissions:
  contents: write

jobs:
  regenerate-lock:
    # Only run on Dependabot-authored PRs
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          # Check out the actual PR branch so we can push back to it.
          # GITHUB_HEAD_REF is set for pull_request events.
          ref: ${{ github.head_ref }}
          # Use a token with write access. The default GITHUB_TOKEN works
          # as long as the "contents: write" permission above is present.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Keep in sync with your .python-version / Pipfile [requires]
          python-version: "3.14"

      - name: Install Pipenv
        run: pip install pipenv

      - name: Regenerate Pipfile.lock
        # pipenv lock regenerates the lock file from the current Pipfile.
        # We do NOT use --deploy here — we want to generate, not validate.
        run: pipenv lock

      - name: Commit updated Pipfile.lock (if changed)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet Pipfile.lock; then
            echo "Pipfile.lock is already up to date — nothing to commit."
          else
            git add Pipfile.lock
            git commit -m "chore: regenerate Pipfile.lock after Dependabot update [skip ci]"
            git push
          fi
